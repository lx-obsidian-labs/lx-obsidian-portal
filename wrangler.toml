name = "lxobsidianmainsite"
pages_build_output_dir = "dist"

compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# D1 Database
# First create: npx wrangler d1 create lx-portal
# Then paste the database_id below
# [[d1_databases]]
# binding = "DB"
# database_name = "lx-portal"
# database_id = "your-database-id-here"

# ─── Environment Variables ───
# Set these via: npx wrangler pages secret put <KEY> --project-name lxobsidianmainsite
# Or use: npx wrangler pages secret bulk .env.wrangler --project-name lxobsidianmainsite
#
# Required secrets:
#   NVIDIA_API_KEY       — https://build.nvidia.com
#   OPENROUTER_API_KEY   — https://openrouter.ai
#   JWT_SECRET           — node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
#   CONTACT_EMAIL        — hello@lxobsidian.com
