name: Vista
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: '17.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    MARKETING_VERSION: 1.0.11
    CURRENT_PROJECT_VERSION: 18
targets:
  Vista:
    type: application
    platform: iOS
    sources:
      - path: Vista
        excludes: [Info.plist]
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.lxobsidian.vistacinema
        TARGETED_DEVICE_FAMILY: '1,2'
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Vista/Info.plist
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  VistaTests:
    type: bundle.unit-test
    platform: iOS
    sources: [VistaTests]
    dependencies:
      - target: Vista
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.lxobsidian.vistacinema.tests
schemes:
  Vista:
    build:
      targets:
        Vista: all
    test:
      targets: [VistaTests]
