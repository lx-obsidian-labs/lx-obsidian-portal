  <rect x="600" y="220" width="160" height="44" rx="22" fill="#1A1A1A"/>
  <text x="630" y="248" font-family="sans-serif" font-size="20" fill="#888">Upcoming</text>
  <!-- Featured -->
  <text x="60" y="340" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">Featured</text>
  <rect x="60" y="370" width="960" height="380" rx="16" fill="#1A0A0A"/>
  <text x="420" y="590" font-family="sans-serif" font-size="80" fill="#2A1A1A">VISTA</text>
  <text x="60" y="730" font-family="sans-serif" font-size="36" font-weight="bold" fill="white">Movie of the Day</text>
  <text x="60" y="770" font-family="sans-serif" font-size="22" fill="#888">Curated picks updated daily</text>
  <!-- Genre grid -->
  <text x="60" y="840" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">Browse by Genre</text>
  <rect x="60" y="880" width="300" height="120" rx="12" fill="#1A0A0A"/>
  <text x="120" y="950" font-family="sans-serif" font-size="24" fill="#E50914">Action</text>
  <rect x="390" y="880" width="300" height="120" rx="12" fill="#0A0A2A"/>
  <text x="450" y="950" font-family="sans-serif" font-size="24" fill="#1E90FF">Sci-Fi</text>
  <rect x="720" y="880" width="300" height="120" rx="12" fill="#0A1A0A"/>
  <text x="790" y="950" font-family="sans-serif" font-size="24" fill="#4CAF50">Comedy</text>
  <rect x="60" y="1020" width="300" height="120" rx="12" fill="#1A0A2A"/>
  <text x="120" y="1090" font-family="sans-serif" font-size="24" fill="#9C27B0">Drama</text>
  <rect x="390" y="1020" width="300" height="120" rx="12" fill="#2A1A0A"/>
  <text x="450" y="1090" font-family="sans-serif" font-size="24" fill="#FF9800">Thriller</text>
  <rect x="720" y="1020" width="300" height="120" rx="12" fill="#0A2A2A"/>
  <text x="790" y="1090" font-family="sans-serif" font-size="24" fill="#00BCD4">Horror</text>
  <!-- Bottom nav -->
  <rect y="1800" width="1080" height="120" fill="#0F0F0F"/>
  <line x1="0" y1="1800" x2="1080" y2="1800" stroke="#1A1A1A" stroke-width="1"/>
  <text x="108" y="1870" font-family="sans-serif" font-size="22" fill="#666">Home</text>
  <text x="324" y="1870" font-family="sans-serif" font-size="22" fill="#E50914">Discover</text>
  <text x="540" y="1870" font-family="sans-serif" font-size="22" fill="#666">Schedule</text>
  <text x="756" y="1870" font-family="sans-serif" font-size="22" fill="#666">Saved</text>
  <text x="972" y="1870" font-family="sans-serif" font-size="22" fill="#666">Profile</text>
</svg>
