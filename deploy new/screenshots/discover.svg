<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#0A0A0A"/>
  <!-- Status bar -->
  <rect width="1080" height="80" fill="#0A0A0A"/>
  <text x="960" y="52" font-family="sans-serif" font-size="28" fill="#888">9:41</text>
  <!-- Title -->
  <text x="60" y="160" font-family="sans-serif" font-size="48" font-weight="bold" fill="white">Discover</text>
  <!-- Categories -->
  <rect x="60" y="220" width="140" height="44" rx="22" fill="#E50914"/>
  <text x="96" y="248" font-family="sans-serif" font-size="20" fill="white">Popular</text>
  <rect x="220" y="220" width="160" height="44" rx="22" fill="#1A1A1A"/>
  <text x="252" y="248" font-family="sans-serif" font-size="20" fill="#888">Top Rated</text>
  <rect x="400" y="220" width="180" height="44" rx="22" fill="#1A1A1A"/>
