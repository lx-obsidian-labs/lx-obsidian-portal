<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#0A0A0A"/>
  <!-- Backdrop -->
  <rect width="1080" height="600" fill="#1A0A0A"/>
  <text x="480" y="380" font-family="sans-serif" font-size="120" fill="#2A1A1A">VISTA</text>
  <!-- Gradient overlay -->
  <defs><linearGradient id="g" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0A0A0A" stop-opacity="0"/><stop offset="1" stop-color="#0A0A0A"/></linearGradient></defs>
  <rect y="400" width="1080" height="200" fill="url(#g)"/>
  <!-- Back button -->
  <circle cx="60" cy="50" r="24" fill="#0008"/>
  <text x="52" y="58" font-family="sans-serif" font-size="28" fill="white">←</text>
  <!-- Play button -->
  <circle cx="540" cy="540" r="48" fill="#E50914"/>
  <text x="528" y="556" font-family="sans-serif" font-size="40" fill="white">▶</text>
  <!-- Title area -->
  <text x="60" y="680" font-family="sans-serif" font-size="44" font-weight="bold" fill="white">Dune: Part Two</text>
  <text x="60" y="730" font-family="sans-serif" font-size="24" fill="#888">2024 &middot; PG-13 &middot; 2h 46m &middot; Sci-Fi, Adventure</text>
  <!-- Rating -->
  <text x="60" y="790" font-family="sans-serif" font-size="28" fill="#E50914">★ 8.5</text>
  <text x="130" y="790" font-family="sans-serif" font-size="22" fill="#666">&middot; 12.5K ratings</text>
  <!-- Buttons -->
  <rect x="60" y="830" width="440" height="56" rx="28" fill="#E50914"/>
  <text x="220" y="866" font-family="sans-serif" font-size="22" fill="white">▶  Watch Trailer</text>
  <rect x="520" y="830" width="220" height="56" rx="28" fill="#222"/>
  <text x="570" y="866" font-family="sans-serif" font-size="22" fill="white">+ Save</text>
  <!-- Overview -->
  <text x="60" y="960" font-family="sans-serif" font-size="26" font-weight="bold" fill="white">Overview</text>
  <text x="60" y="1000" font-family="sans-serif" font-size="22" fill="#888">Paul Atreides unites with Chani and the Fremen while on a warpath of revenge against the conspirators who destroyed his family.</text>
  <!-- Cast -->
  <text x="60" y="1100" font-family="sans-serif" font-size="26" font-weight="bold" fill="white">Cast</text>
  <circle cx="140" cy="1220" r="50" fill="#1A1A1A"/>
  <text x="125" y="1230" font-family="sans-serif" font-size="30" fill="#888">T</text>
  <text x="80" y="1290" font-family="sans-serif" font-size="18" fill="white">Timothée</text>
  <text x="80" y="1312" font-family="sans-serif" font-size="16" fill="#666">Paul Atreides</text>
  <circle cx="360" cy="1220" r="50" fill="#1A1A1A"/>
  <text x="348" y="1230" font-family="sans-serif" font-size="30" fill="#888">Z</text>
  <text x="300" y="1290" font-family="sans-serif" font-size="18" fill="white">Zendaya</text>
  <text x="300" y="1312" font-family="sans-serif" font-size="16" fill="#666">Chani</text>
  <circle cx="580" cy="1220" r="50" fill="#1A1A1A"/>
  <text x="566" y="1230" font-family="sans-serif" font-size="30" fill="#888">R</text>
  <text x="520" y="1290" font-family="sans-serif" font-size="18" fill="white">Rebecca</text>
  <text x="520" y="1312" font-family="sans-serif" font-size="16" fill="#666">Lady Jessica</text>
  <circle cx="800" cy="1220" r="50" fill="#1A1A1A"/>
  <text x="786" y="1230" font-family="sans-serif" font-size="30" fill="#888">A</text>
  <text x="740" y="1290" font-family="sans-serif" font-size="18" fill="white">Austin</text>
  <text x="740" y="1312" font-family="sans-serif" font-size="16" fill="#666">Feyd-Rautha</text>
  <!-- Where to watch -->
  <text x="60" y="1400" font-family="sans-serif" font-size="26" font-weight="bold" fill="white">Where to Watch</text>
  <rect x="60" y="1430" width="200" height="80" rx="12" fill="#111"/>
  <text x="110" y="1480" font-family="sans-serif" font-size="20" fill="white">Netflix</text>
  <rect x="280" y="1430" width="200" height="80" rx="12" fill="#111"/>
  <text x="340" y="1480" font-family="sans-serif" font-size="20" fill="white">Amazon</text>
  <rect x="500" y="1430" width="200" height="80" rx="12" fill="#111"/>
  <text x="540" y="1480" font-family="sans-serif" font-size="20" fill="white">Disney+</text>
</svg>
