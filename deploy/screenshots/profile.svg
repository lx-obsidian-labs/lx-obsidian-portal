<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1920" viewBox="0 0 1080 1920">
  <rect width="1080" height="1920" fill="#0A0A0A"/>
  <!-- Status bar -->
  <rect width="1080" height="80" fill="#0A0A0A"/>
  <text x="960" y="52" font-family="sans-serif" font-size="28" fill="#888">9:41</text>
  <!-- Profile header -->
  <circle cx="540" cy="240" r="80" fill="#E50914"/>
  <text x="520" y="256" font-family="sans-serif" font-size="60" fill="white">N</text>
  <text x="540" y="370" font-family="sans-serif" font-size="36" font-weight="bold" fill="white" text-anchor="middle">Nathan</text>
  <text x="540" y="410" font-family="sans-serif" font-size="20" fill="#666" text-anchor="middle">nathan@vista.app</text>
  <!-- Stats -->
  <rect x="120" y="460" width="280" height="100" rx="12" fill="#111"/>
  <text x="260" y="510" font-family="sans-serif" font-size="32" font-weight="bold" fill="#E50914" text-anchor="middle">47</text>
  <text x="260" y="540" font-family="sans-serif" font-size="18" fill="#666" text-anchor="middle">Watchlist</text>
  <rect x="420" y="460" width="240" height="100" rx="12" fill="#111"/>
