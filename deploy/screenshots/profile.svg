  <text x="820" y="540" font-family="sans-serif" font-size="18" fill="#666" text-anchor="middle">Reviews</text>
  <!-- Settings menu -->
  <text x="60" y="640" font-family="sans-serif" font-size="28" font-weight="bold" fill="white">Settings</text>
  <rect x="60" y="680" width="960" height="72" rx="12" fill="#111"/>
  <text x="120" y="726" font-family="sans-serif" font-size="22" fill="white">Theme</text>
  <text x="880" y="726" font-family="sans-serif" font-size="22" fill="#888">Dark ›</text>
  <rect x="60" y="764" width="960" height="72" rx="12" fill="#111"/>
  <text x="120" y="810" font-family="sans-serif" font-size="22" fill="white">Notifications</text>
  <text x="880" y="810" font-family="sans-serif" font-size="22" fill="#888">On ›</text>
  <rect x="60" y="848" width="960" height="72" rx="12" fill="#111"/>
  <text x="120" y="894" font-family="sans-serif" font-size="22" fill="white">Streaming Quality</text>
  <text x="880" y="894" font-family="sans-serif" font-size="22" fill="#888">HD ›</text>
  <rect x="60" y="932" width="960" height="72" rx="12" fill="#111"/>
  <text x="120" y="978" font-family="sans-serif" font-size="22" fill="white">Cellular Streaming</text>
  <text x="880" y="978" font-family="sans-serif" font-size="22" fill="#888">On ›</text>
  <rect x="60" y="1016" width="960" height="72" rx="12" fill="#111"/>
  <text x="120" y="1062" font-family="sans-serif" font-size="22" fill="white">Language</text>
  <text x="880" y="1062" font-family="sans-serif" font-size="22" fill="#888">English ›</text>
  <!-- Sign out -->
  <rect x="60" y="1140" width="960" height="72" rx="12" fill="#2A0A0A"/>
  <text x="480" y="1186" font-family="sans-serif" font-size="22" fill="#E50914" text-anchor="middle">Sign Out</text>
  <!-- Bottom nav -->
  <rect y="1800" width="1080" height="120" fill="#0F0F0F"/>
  <line x1="0" y1="1800" x2="1080" y2="1800" stroke="#1A1A1A" stroke-width="1"/>
  <text x="108" y="1870" font-family="sans-serif" font-size="22" fill="#666">Home</text>
  <text x="324" y="1870" font-family="sans-serif" font-size="22" fill="#666">Discover</text>
  <text x="540" y="1870" font-family="sans-serif" font-size="22" fill="#666">Schedule</text>
  <text x="756" y="1870" font-family="sans-serif" font-size="22" fill="#666">Saved</text>
  <text x="972" y="1870" font-family="sans-serif" font-size="22" fill="#E50914">Profile</text>
