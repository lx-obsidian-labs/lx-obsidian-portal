name: Verify portal

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portal-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and project checks
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund
      - name: Verify engineering documentation
        run: npm run check:docs
      - name: Test contact API behavior
        run: npm test
      - name: Build and verify generated output
        run: npm run build
