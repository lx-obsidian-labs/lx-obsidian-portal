<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="theme-color" content="#030305">
  <link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
  <meta name="description" content="LX AI Coding Platform — generate, debug, and preview web apps with NVIDIA and OpenRouter models">
  <meta property="og:title" content="LX AI Coding Platform">
  <meta property="og:description" content="Build web apps with AI in your browser">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://www.lxobsidianportal.co.za/ai">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="robots" content="noindex, noarchive, nosnippet">
  <title>LX AI Coding Platform</title>
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "LX AI Coding Platform",
    "description": "Generate, debug, and preview web apps with free NVIDIA and OpenRouter AI models. Build web apps in your browser.",
    "url": "https://www.lxobsidianportal.co.za/ai",
    "applicationCategory": "DeveloperApplication",
    "operatingSystem": "Web",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "ZAR"
    },
    "author": {
      "@type": "Organization",
      "name": "LX Obsidian Labs",
      "url": "https://www.lxobsidianportal.co.za"
    }
  }
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/monaco-editor@0.50.0/min/monaco.editor.js"></script>
  <style>
    /* Color System - 4 colors max */
    :root {
      --bg:#0a0a0f;
      --card:#111118;
      --muted:#6b7280;
      --accent:#7c5cff;
      --accent-light:#9f78e1;
      --text:#f4f4f5;
      --border:#30363d;
    }

    /* Typography */
    *, *::before, *::after { box-sizing: border-box; margin: 0; }
    html { font-family: 'Inter', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
    body { min-height: 100vh; background: var(--bg); color: var(--text); overflow: hidden; }

    /* Layout */
    .app { display: flex; height: 100vh; width: 100vw; overflow: hidden; font-family: 'Inter', system-ui, sans-serif; font-size: 13px; line-height: 1.5; }
    .app > * { flex-shrink: 0; }

    /* Left Sidebar - File Explorer */
    .sidebar { width: 260px; background: var(--card); border-right: 1px solid var(--border); display: flex; flex-direction: column; }
    .sidebar-header { padding: 16px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; }
    .sidebar-title { font: 500 12px/1 'Space Grotesk', sans-serif; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .sidebar-actions { display: flex; gap: 8px; }
    .btn-icon { width: 32px; height: 32px; padding: 6px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 18px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: background .15s; }
    .btn-icon:hover { background: var(--bg); color: var(--text); }
    .btn-icon.active { background: rgba(124, 92, 255, .15); color: var(--accent); }
    .file-tree { flex: 1; overflow-y: auto; padding: 8px 0; }
    .file-item { padding: 6px 12px; cursor: pointer; font-size: 12px; transition: background .1s; user-select: none; }
    .file-item:hover { background: rgba(255,255,255,.04); }
    .file-item.active { background: rgba(124, 92, 255, .12); color: var(--accent); }
    .file-item .icon { width: 14px; text-align: center; color: var(--muted); margin-right: 8px; }
    .file-item.folder .icon { content: "📁"; }
    .file-item.file .icon { content: "📄"; }
    .bottom-bar { padding: 12px; border-top: 1px solid var(--border); display: flex; gap: 8px; background: var(--bg); }
    .bottom-bar .btn { flex: 1; padding: 6px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; color: var(--muted); font-size: 11px; font-weight: 500; cursor: pointer; transition: all .15s; }
    .bottom-bar .btn:hover { border-color: var(--accent); color: var(--accent); }
    .bottom-bar .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
    .bottom-bar .btn.secondary { background: transparent; }

    /* Center Chat Panel */
    .chat { flex: 1; display: flex; flex-direction: column; background: var(--card); overflow: hidden; }
    .chat-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg); }
    .chat-header h1 { font: 500 13px/1 'Space Grotesk', sans-serif; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); }
    .model-pills { display: flex; gap: 6px; }
    .model-pill { padding: 4px 8px; background: var(--bg); border: 1px solid var(--border); border-radius: 20px; font-size: 10px; font-weight: 500; color: var(--muted); cursor: pointer; transition: all .15s; }
    .model-pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
    .model-pill:hover:not(.active) { background: rgba(124, 92, 255, .1); color: var(--accent); }
    .chat-messages { flex: 1; padding: 16px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; }
    .message { max-width: 80%; padding: 10px 14px; border-radius: 16px; font-size: 13px; line-height: 1.5; }
    .message.user { align-self: flex-end; background: rgba(124, 92, 255, .1); color: var(--text); }
    .message.assistant { align-self: flex-start; background: var(--card); color: var(--text); }
    .message.assistant .avatar { width: 28px; height: 28px; border-radius: 50%; background: var(--accent); color: #fff; font: 600 11px/1 'Space Grotesk', sans-serif; display: flex; align-items: center; justify-content: center; margin-right: 8px; flex-shrink: 0; }
    .message.user .avatar { background: var(--card); color: var(--accent); }
    .message .content { white-space: pre-wrap; word-break: break-word; }
    .message .meta { font-size: 10px; color: var(--muted); margin-top: 4px; }
    .welcome-screen { text-align: center; padding: 40px 20px; color: var(--muted); }
    .welcome-screen h2 { font: 600 24px/1 'Space Grotesk', sans-serif; margin: 12px 0 4px; }
    .welcome-screen p { font-size: 14px; }
    .suggestions { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 16px; }
    .suggestion { padding: 8px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; font-size: 11px; cursor: pointer; transition: background .15s; }
    .suggestion:hover { background: rgba(124, 92, 255, .1); }

    /* Right Code Panel */
    .code { flex: 1; background: var(--bg); overflow: hidden; }
    .code-header { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; background: var(--bg); font-size: 11px; color: var(--muted); }
    .code-header .tabs { display: flex; gap: 4px; }
    .code-tab { padding: 6px 10px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px 6px 0 0; color: var(--muted); cursor: pointer; font-weight: 500; }
    .code-tab.active { background: var(--card); border-color: var(--border); color: var(--text); border-bottom: 0; }
    .monaco-editor { height: calc(100vh - 200px); }
    .action-btns { padding: 8px 16px; display: flex; gap: 6px; }
    .action-btn { padding: 6px 12px; background: var(--bg); border: 1px solid var(--border); border-radius: 6px; font-size: 11px; font-weight: 500; cursor: pointer; transition: all .15s; }
    .action-btn:hover { background: rgba(124, 92, 255, .1); border-color: var(--accent); color: var(--accent); }
    .action-btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }

    /* Responsive */
    @media (max-width: 1024px) { .sidebar { width: 200px; } }
    @media (max-width: 768px) { .app { flex-direction: column; } .sidebar { width: 100%; border-right: 0; border-bottom: 1px solid var(--border); } .code { height: 400px; } }
  </style>
</head>
<body>
  <div class="app">
    <!-- Left: File Explorer Sidebar -->
    <div class="sidebar">
      <div class="sidebar-header">
        <span class="sidebar-title">LX AI</span>
        <div class="sidebar-actions">
          <button class="btn-icon" title="New File" onclick="addFile('untitled.html')">+</button>
          <button class="btn-icon" title="New Folder">📁</button>
        </div>
      </div>
      <div class="file-tree" id="fileTree">
        <!-- Files will be rendered by JS -->
      </div>
      <div class="bottom-bar">
        <button class="btn secondary" onclick="exportProject()">Download ZIP</button>
        <button class="btn primary" onclick="buildProject()">Build & Deploy</button>
      </div>
    </div>

    <!-- Center: Chat Panel -->
    <div class="chat">
      <div class="chat-header">
        <h1>LX AI Assistant</h1>
        <div class="model-pills" id="modelPills">
          <div class="model-pill active" data-model="nvidia:meta/llama3-70b-instruct">Llama 3 70B</div>
          <div class="model-pill" data-model="nvidia:qwen/qwen2.5-72b-instruct">Qwen 2.5 72B</div>
          <div class="model-pill" data-model="openrouter:mistralai/mistral-7b-instruct:free">Mistral 7B</div>
        </div>
      </div>
      <div class="chat-messages" id="chatMessages">
        <div class="welcome-screen">
          <h2>What do you want to build today?</h2>
          <p>Describe a web app, landing page, or automation — and I'll generate it instantly</p>
          <div class="suggestions">
            <div class="suggestion" onclick="sendPrompt('Build a modern landing page with hero, features, and pricing')">Landing Page</div>
            <div class="suggestion" onclick="sendPrompt('Create a responsive dashboard with sidebar and cards')">Dashboard</div>
            <div class="suggestion" onclick="sendPrompt('Build a todo app with add, delete, mark complete')">Todo App</div>
          </div>
        </div>
      </div>
      <div class="chat-input-wrap">
        <input type="text" id="chatInput" placeholder="Describe what you want to build..." onkeydown="if(event.key==='Enter')sendMessage()" />
        <button class="action-btn primary" onclick="sendMessage()">Generate</button>
        <button class="action-btn secondary" onclick="uploadFile()">Attach</button>
      </div>
    </div>

    <!-- Right: Code Panel -->
    <div class="code">
      <div class="code-header">
        <div class="code-header-left">
          <span>LX AI Platform</span>
        </div>
        <div class="code-header-right">
          <div class="action-btns">
            <button class="action-btn" onclick="exportCode()">Export</button>
            <button class="action-btn primary" onclick="buildCode()">Build</button>
          </div>
        </div>
      </div>
      <div id="monacoEditor" style="height: calc(100vh - 200px);"></div>
    </div>
  </div>

  <script>
    // Initialize Monaco Editor
    require(['vs/editor/editor.main'], function() {
      monaco.editor.create(document.getElementById('monacoEditor'), {
        value: '<!DOCTYPE html>\n<html lang="en">\n<head>\n  <meta charset="UTF-8">\n  <meta name="viewport" content="width=device-width, initial-scale=1.0">\n  <title>My App</title>\n  <style>\n    * { margin: 0; padding: 0; box-sizing: border-box; }\n    body { font-family: Inter, system-ui, sans-serif; background: #0a0a0f; color: #e5e5e7; min-height: 100vh; display: flex; align-items: center; justify-content: center; }\n    h1 { font-size: 2rem; opacity: 0; animation: fadeUp .6s ease forwards; }\n    @keyframes fadeUp { to { opacity: 1; transform: translateY(0); } }\n  </style>\n</head>\n<body>\n  <h1>Hello World</h1>\n</body>\n</html>',
        language: 'html',
        theme: 'vs-dark',
        automaticLayout: true,
        fontFamily: 'JetBrains Mono, monospace',
        fontSize: 13,
        lineNumbers: true,
        roundedSelection: true
      });
    });

    // Model pills
    document.querySelectorAll('.model-pill').forEach(pill => {
      pill.addEventListener('click', function() {
        document.querySelectorAll('.model-pill').forEach(p => p.classList.remove('active'));
        this.classList.add('active');
      });
    });

    // Chat functionality
    const chatMessages = document.getElementById('chatMessages');
    const chatInput = document.getElementById('chatInput');

    function sendMessage() {
      const text = chatInput.value.trim();
      if (!text) return;
      addMessage('user', text);
      chatInput.value = '';
      // Simulate AI response
      setTimeout(() => {
        addMessage('assistant', `✦ I generated: ${text.slice(0, 50)}${text.length > 50 ? '...' : ''}`);
      }, 1200);
    }

    function addMessage(role, content) {
      const div = document.createElement('div');
      div.className = `message ${role}`;
      div.innerHTML = `<div class="avatar">${role === 'assistant' ? 'LX' : 'You'}</div><div class="content">${content}</div><div class="meta">${new Date().toLocaleTimeString}</div>`;
      chatMessages.appendChild(div);
      chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function sendPrompt(text) {
      chatInput.value = text;
      sendMessage();
    }

    // File tree (simple)
    const fileTree = document.getElementById('fileTree');
    fileTree.innerHTML = `
      <div class="file-item folder active" onclick="openFile('index.html')">
        <span class="icon"></span><span>index.html</span>
      </div>
      <div class="file-item file" onclick="openFile('styles.css')">
        <span class="icon"></span><span>styles.css</span>
      </div>
      <div class="file-item file" onclick="openFile('script.js')">
        <span class="icon"></span><span>script.js</span>
      </div>
    `;

    function openFile(path) {
      // Monaco will load the file
    }

    function exportProject() {
      alert('Project exported as ZIP');
    }

    function buildProject() {
      alert('Building and deploying...');
    }

    function uploadFile() {
      alert('Attach file functionality');
    }
  </script>
</body>
</html>
