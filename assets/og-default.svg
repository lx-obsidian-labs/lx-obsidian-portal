<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E50914" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#E50914" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="logoGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E50914"/>
      <stop offset="100%" stop-color="#B20710"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0A0A0A"/>
  <rect x="0" y="0" width="600" height="630" fill="url(#accent)"/>
  <ellipse cx="1050" cy="100" rx="400" ry="400" fill="#E50914" opacity="0.04"/>

  <!-- LX Logo Mark -->
  <rect x="520" y="160" width="160" height="160" rx="32" fill="url(#logoGrad)"/>
  <text x="600" y="275" font-family="Arial, Helvetica, sans-serif" font-weight="bold" font-size="80" fill="#FFFFFF" text-anchor="middle" dominant-baseline="central">LX</text>

  <!-- Company Name -->
  <text x="600" y="390" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="48" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">LX Obsidian Labs</text>

  <!-- Tagline -->
  <text x="600" y="445" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="22" fill="#888888" text-anchor="middle" letter-spacing="4">Software. Automation. Intelligence.</text>

  <!-- Bottom accent line -->
  <rect x="480" y="475" width="240" height="2" rx="1" fill="#E50914" opacity="0.6"/>
</svg>