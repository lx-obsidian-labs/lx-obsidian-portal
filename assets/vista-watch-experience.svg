<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1400" viewBox="0 0 1200 1400" role="img" aria-labelledby="title desc"><title id="title">Vista Watch — Made for the way you watch</title><desc id="desc">New Vista Watch branding with television and phone interface illustrations.</desc><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#080808"/><stop offset="1" stop-color="#1e1017"/></linearGradient><linearGradient id="screen" x2="1" y2="1"><stop stop-color="#3c2635"/><stop offset="1" stop-color="#152033"/></linearGradient></defs><rect width="1200" height="1400" rx="44" fill="url(#background)"/><g font-family="Arial,Helvetica,sans-serif"><text x="80" y="120" fill="#fff" font-size="37" font-weight="800" letter-spacing="4">VISTA <tspan fill="#e50914">WATCH</tspan></text><text x="80" y="231" fill="#fff" font-size="60" font-weight="800">Made for the way</text><text x="80" y="304" fill="#ff2935" font-size="60" font-weight="800">you watch.</text><text x="80" y="365" fill="#b5adb8" font-size="24">One familiar name. More room for your stories.</text><rect x="80" y="442" width="1040" height="540" rx="25" fill="#080808" stroke="#4a414c" stroke-width="4"/><rect x="100" y="462" width="1000" height="500" rx="12" fill="url(#screen)"/><text x="144" y="523" fill="#fff" font-size="24" font-weight="800">VISTA WATCH</text><text x="145" y="615" fill="#fff" font-size="44" font-weight="700">Your next great watch.</text><rect x="145" y="659" width="191" height="54" rx="11" fill="#e50914"/><text x="177" y="694" fill="#fff" font-size="19" font-weight="700">Explore a title</text><rect x="145" y="762" width="138" height="146" rx="12" fill="#563244" stroke="#ff3844" stroke-width="4"/><rect x="305" y="771" width="128" height="137" rx="12" fill="#263e57"/><rect x="455" y="771" width="128" height="137" rx="12" fill="#564331"/><rect x="605" y="771" width="128" height="137" rx="12" fill="#342d46"/><rect x="755" y="771" width="128" height="137" rx="12" fill="#3c3643"/><rect x="905" y="771" width="128" height="137" rx="12" fill="#263d41"/><path d="M550 982v43h100v-43M470 1028h260" stroke="#49414b" stroke-width="10"/><text x="80" y="1135" fill="#fff" font-size="29" font-weight="700">Clear focus. Your own watchlist.</text><text x="80" y="1182" fill="#b5adb8" font-size="23">Discover on Android, tablet and supported TVs.</text><text x="80" y="1235" fill="#b5adb8" font-size="21">Native iOS developer builds are available; Apple signing is required.</text><text x="80" y="1312" fill="#77717b" font-size="16">Interface illustration · Features and source availability differ by platform.</text></g></svg>
